<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solace — Create Account</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet"
    >

    <style>
        body {
            background:
                radial-gradient(circle at 50% 10%, rgba(41,78,63,.35), transparent 35%),
                #051424;
        }

        .glass {
            background: rgba(18,33,49,.58);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,.08);
        }

        input {
            background: rgba(5,20,36,.65) !important;
            border: 1px solid rgba(255,255,255,.1) !important;
            color: white !important;
        }

        input:focus {
            border-color: rgba(168,207,188,.7) !important;
            box-shadow: 0 0 0 3px rgba(168,207,188,.08) !important;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-5 py-10 text-white">

<div class="w-full max-w-md">

    <a href="landing.html"
       class="block text-center text-2xl font-bold text-[#A8CFBC] mb-8"
       style="font-family:Manrope,sans-serif">
        Solace
    </a>

    <div class="glass rounded-3xl p-7 md:p-9">

        <div class="text-center">

            <div class="mx-auto w-14 h-14 rounded-2xl bg-[#294E3F] flex items-center justify-center">
                <span class="material-symbols-outlined text-[#A8CFBC] text-3xl">
                    spa
                </span>
            </div>

            <h1 class="mt-5 text-3xl font-bold">
                Create Your Space
            </h1>

            <p class="mt-2 text-white/50">
                Start your Solace journey.
            </p>

        </div>

        <div id="message"
             class="hidden mt-6 rounded-xl px-4 py-3 text-sm">
        </div>

        <form id="registerForm" class="mt-7 space-y-5">

            <div>
                <label class="block text-sm text-white/70 mb-2">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    autocomplete="email"
                    placeholder="you@example.com"
                    class="w-full rounded-xl px-4 py-3.5 outline-none"
                >
            </div>

            <div>
                <label class="block text-sm text-white/70 mb-2">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    class="w-full rounded-xl px-4 py-3.5 outline-none"
                >

                <div class="mt-2 h-1.5 bg-white/5 rounded-full overflow-hidden">
                    <div id="strengthBar"
                         class="h-full w-0 transition-all"></div>
                </div>

                <p id="strengthText"
                   class="mt-2 text-xs text-white/35">
                    Use at least 8 characters.
                </p>
            </div>

            <div>
                <label class="block text-sm text-white/70 mb-2">
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    required
                    autocomplete="new-password"
                    placeholder="Repeat your password"
                    class="w-full rounded-xl px-4 py-3.5 outline-none"
                >
            </div>

            <label class="flex gap-3 text-xs text-white/45 leading-5">

                <input
                    id="terms"
                    type="checkbox"
                    required
                    class="mt-1"
                >

                <span>
                    I understand that Solace is a wellness support tool
                    and is not a replacement for professional care.
                </span>

            </label>

            <button
                id="registerBtn"
                type="submit"
                class="w-full rounded-xl bg-[#A8CFBC] text-slate-950 py-3.5 font-semibold"
            >
                Create Account
            </button>

        </form>

        <div class="mt-7 pt-6 border-t border-white/10 text-center text-sm text-white/45">

            Already have an account?

            <a href="login.html"
               class="text-[#A8CFBC] font-semibold">
                Sign in
            </a>

        </div>

    </div>

</div>

<script>
    const API_BASE = "http://127.0.0.1:8000";

    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("registerBtn");

    const password =
        document.getElementById("password");

    function showMessage(text, success = false) {

        message.textContent = text;

        message.className =
            "mt-6 rounded-xl px-4 py-3 text-sm " +
            (success
                ? "bg-green-500/10 text-green-300 border border-green-500/20"
                : "bg-red-500/10 text-red-200 border border-red-500/20");

        message.classList.remove("hidden");
    }

    password.addEventListener("input", () => {

        const value = password.value;

        let score = 0;

        if (value.length >= 8) score++;
        if (/[A-Z]/.test(value)) score++;
        if (/[a-z]/.test(value)) score++;
        if (/[0-9]/.test(value)) score++;
        if (/[^A-Za-z0-9]/.test(value)) score++;

        const bar =
            document.getElementById("strengthBar");

        const text =
            document.getElementById("strengthText");

        bar.style.width =
            `${score * 20}%`;

        if (score <= 1) {
            bar.style.background = "#ef4444";
            text.textContent = "Weak password.";
        } else if (score <= 3) {
            bar.style.background = "#eab308";
            text.textContent = "Moderate password.";
        } else {
            bar.style.background = "#A8CFBC";
            text.textContent = "Strong password.";
        }
    });

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const passwordValue =
            password.value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (passwordValue.length < 8) {
            showMessage(
                "Password must contain at least 8 characters."
            );
            return;
        }

        if (passwordValue !== confirmPassword) {
            showMessage(
                "Passwords do not match."
            );
            return;
        }

        button.disabled = true;
        button.textContent = "Creating account...";

        /*
         * IMPORTANT:
         * The current FastAPI register endpoint receives
         * email and password as query parameters.
         */

        const url =
            `${API_BASE}/auth/register` +
            `?email=${encodeURIComponent(email)}` +
            `&password=${encodeURIComponent(passwordValue)}`;

        try {

            const response =
                await fetch(url, {
                    method: "POST"
                });

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Registration failed."
                );
            }

            showMessage(
                "Your Solace account was created successfully.",
                true
            );

            setTimeout(() => {
                window.location.href = "login.html";
            }, 800);

        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to create your account."
            );

        } finally {

            button.disabled = false;
            button.textContent = "Create Account";
        }
    });
</script>

</body>
</html>
