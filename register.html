<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solace — Create Account</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0;1"
        rel="stylesheet"
    >

    <script>
        tailwind.config = {

            darkMode: "class",

            theme: {

                extend: {

                    colors: {

                        background: "#051424",
                        surface: "#051424",

                        primary: "#d4e4fa",

                        secondary: "#a8cfbc",
                        secondaryContainer: "#294e3f",

                        surfaceContainer: "#122131",
                        surfaceHigh: "#1c2b3c",
                        surfaceHighest: "#273647",

                        muted: "#c6c6cd",

                        error: "#ffb4ab"

                    },

                    fontFamily: {

                        display: [
                            "Manrope",
                            "sans-serif"
                        ],

                        body: [
                            "Inter",
                            "sans-serif"
                        ]

                    }

                }

            }

        };
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(41, 78, 63, 0.35),
                    transparent 35%
                ),
                #051424;
        }

        .glass {
            background: rgba(18, 33, 49, 0.55);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border: 1px solid rgba(255,255,255,0.08);
        }

        .input-field {

            background: rgba(5,20,36,0.65);

            border: 1px solid rgba(255,255,255,0.1);

            transition:
                border-color .2s ease,
                box-shadow .2s ease;

        }

        .input-field:focus {

            border-color:
                rgba(168,207,188,0.8);

            box-shadow:
                0 0 0 3px
                rgba(168,207,188,0.08);

        }

        .password-strength {
            transition:
                width .25s ease,
                background-color .25s ease;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 999px;

            background: rgba(255,255,255,.75);

            animation:
                floatStar 8s linear infinite;
        }

        @keyframes floatStar {

            0% {
                opacity: .1;
                transform: translateY(0);
            }

            50% {
                opacity: .8;
            }

            100% {
                opacity: 0;
                transform: translateY(-90px);
            }

        }

        .spinner {
            width: 18px;
            height: 18px;

            border: 2px solid
                rgba(15,23,42,.25);

            border-top-color:
                rgba(15,23,42,.9);

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

    </style>
</head>

<body class="min-h-screen text-primary font-body">

    <!-- Background -->
    <div
        id="starfield"
        class="fixed inset-0 overflow-hidden pointer-events-none"
    ></div>


    <!-- Header -->

    <header class="absolute top-0 left-0 right-0 z-20">

        <div class="max-w-6xl mx-auto px-5 py-5">

            <a
                href="landing.html"
                class="inline-flex items-center gap-2 text-secondary font-display font-bold text-xl"
            >

                <span class="material-symbols-outlined">
                    spa
                </span>

                Solace

            </a>

        </div>

    </header>


    <!-- Main -->

    <main class="min-h-screen flex items-center justify-center px-5 py-24">

        <div class="w-full max-w-md">

            <div class="glass rounded-3xl p-7 md:p-9 shadow-2xl">

                <!-- Header -->

                <div class="text-center mb-8">

                    <div class="mx-auto w-14 h-14 rounded-2xl bg-secondaryContainer flex items-center justify-center">

                        <span class="material-symbols-outlined text-secondary text-3xl">
                            self_improvement
                        </span>

                    </div>

                    <h1 class="mt-5 text-3xl font-display font-bold text-white">
                        Create Your Space
                    </h1>

                    <p class="mt-2 text-white/50">
                        Begin your Solace journey.
                    </p>

                </div>


                <!-- Error -->

                <div
                    id="error-message"
                    class="hidden mb-5 rounded-xl border border-red-400/20 bg-red-400/10 px-4 py-3 text-sm text-red-200"
                ></div>


                <!-- Success -->

                <div
                    id="success-message"
                    class="hidden mb-5 rounded-xl border border-secondary/20 bg-secondary/10 px-4 py-3 text-sm text-secondary"
                ></div>


                <!-- Form -->

                <form
                    id="register-form"
                    class="space-y-5"
                >

                    <!-- Email -->

                    <div>

                        <label
                            for="email"
                            class="block text-sm font-medium text-white/70 mb-2"
                        >
                            Email address
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/35">

                                <span class="material-symbols-outlined">
                                    mail
                                </span>

                            </span>

                            <input
                                id="email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                required
                                placeholder="you@example.com"
                                class="input-field w-full rounded-xl px-4 pl-12 py-3.5 text-white placeholder:text-white/25 outline-none"
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div>

                        <label
                            for="password"
                            class="block text-sm font-medium text-white/70 mb-2"
                        >
                            Password
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/35">

                                <span class="material-symbols-outlined">
                                    lock
                                </span>

                            </span>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                required
                                minlength="8"
                                placeholder="At least 8 characters"
                                class="input-field w-full rounded-xl px-4 pl-12 pr-12 py-3.5 text-white placeholder:text-white/25 outline-none"
                            >

                            <button
                                type="button"
                                id="toggle-password"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-white/35 hover:text-white"
                            >

                                <span
                                    id="password-icon"
                                    class="material-symbols-outlined"
                                >
                                    visibility
                                </span>

                            </button>

                        </div>


                        <!-- Strength -->

                        <div class="mt-3">

                            <div class="h-1.5 bg-white/5 rounded-full overflow-hidden">

                                <div
                                    id="strength-bar"
                                    class="password-strength h-full w-0 rounded-full"
                                ></div>

                            </div>

                            <p
                                id="strength-text"
                                class="mt-2 text-xs text-white/35"
                            >
                                Use at least 8 characters.
                            </p>

                        </div>

                    </div>


                    <!-- Confirm password -->

                    <div>

                        <label
                            for="confirm-password"
                            class="block text-sm font-medium text-white/70 mb-2"
                        >
                            Confirm password
                        </label>

                        <div class="relative">

                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/35">

                                <span class="material-symbols-outlined">
                                    lock_reset
                                </span>

                            </span>

                            <input
                                id="confirm-password"
                                name="confirm-password"
                                type="password"
                                autocomplete="new-password"
                                required
                                placeholder="Repeat your password"
                                class="input-field w-full rounded-xl px-4 pl-12 pr-12 py-3.5 text-white placeholder:text-white/25 outline-none"
                            >

                        </div>

                    </div>


                    <!-- Agreement -->

                    <label class="flex items-start gap-3 cursor-pointer">

                        <input
                            id="terms"
                            type="checkbox"
                            required
                            class="mt-1 rounded border-white/20 bg-transparent text-secondary focus:ring-secondary"
                        >

                        <span class="text-xs leading-5 text-white/45">
                            I understand that Solace is a wellness support
                            tool and not a replacement for professional
                            medical or mental-health care.
                        </span>

                    </label>


                    <!-- Submit -->

                    <button
                        id="register-button"
                        type="submit"
                        class="w-full rounded-xl bg-secondary text-slate-950 font-semibold py-3.5 flex items-center justify-center gap-2 hover:opacity-90 transition"
                    >

                        <span id="register-button-text">
                            Create Account
                        </span>

                        <span
                            id="register-spinner"
                            class="spinner hidden"
                        ></span>

                        <span
                            id="register-arrow"
                            class="material-symbols-outlined"
                        >
                            arrow_forward
                        </span>

                    </button>

                </form>


                <!-- Login -->

                <div class="mt-7 pt-6 border-t border-white/10 text-center">

                    <p class="text-sm text-white/45">

                        Already have an account?

                        <a
                            href="login.html"
                            class="text-secondary font-semibold hover:underline"
                        >
                            Sign in
                        </a>

                    </p>

                </div>


                <div class="mt-6 text-center">

                    <a
                        href="landing.html"
                        class="text-sm text-white/35 hover:text-white transition"
                    >
                        ← Back to Solace
                    </a>

                </div>

            </div>


            <p class="mt-5 text-center text-xs text-white/30">

                Your account credentials are handled by the Solace backend.

            </p>

        </div>

    </main>


    <script src="api.js"></script>

    <script src="auth.js"></script>

    <script>
        requireAuth();
    </script>

    <script>

        const registerForm =
            document.getElementById(
                "register-form"
            );

        const emailInput =
            document.getElementById(
                "email"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirm-password"
            );

        const registerButton =
            document.getElementById(
                "register-button"
            );

        const registerButtonText =
            document.getElementById(
                "register-button-text"
            );

        const registerSpinner =
            document.getElementById(
                "register-spinner"
            );

        const registerArrow =
            document.getElementById(
                "register-arrow"
            );

        const errorMessage =
            document.getElementById(
                "error-message"
            );

        const successMessage =
            document.getElementById(
                "success-message"
            );


        /*
         * Messages
         */

        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.classList.remove(
                "hidden"
            );

            successMessage.classList.add(
                "hidden"
            );

        }


        function showSuccess(message) {

            successMessage.textContent =
                message;

            successMessage.classList.remove(
                "hidden"
            );

            errorMessage.classList.add(
                "hidden"
            );

        }


        /*
         * Loading state
         */

        function setLoading(loading) {

            registerButton.disabled =
                loading;

            registerSpinner.classList.toggle(
                "hidden",
                !loading
            );

            registerArrow.classList.toggle(
                "hidden",
                loading
            );

            registerButtonText.textContent =
                loading
                    ? "Creating account..."
                    : "Create Account";

        }


        /*
         * Password strength
         */

        const strengthBar =
            document.getElementById(
                "strength-bar"
            );

        const strengthText =
            document.getElementById(
                "strength-text"
            );


        function updatePasswordStrength(password) {

            let score = 0;

            if (password.length >= 8) {
                score++;
            }

            if (/[A-Z]/.test(password)) {
                score++;
            }

            if (/[a-z]/.test(password)) {
                score++;
            }

            if (/[0-9]/.test(password)) {
                score++;
            }

            if (/[^A-Za-z0-9]/.test(password)) {
                score++;
            }


            const widths = [
                "0%",
                "20%",
                "40%",
                "60%",
                "80%",
                "100%"
            ];

            strengthBar.style.width =
                widths[score];


            if (score <= 1) {

                strengthBar.style.background =
                    "#ef4444";

                strengthText.textContent =
                    "Very weak password.";

            }

            else if (score === 2) {

                strengthBar.style.background =
                    "#f97316";

                strengthText.textContent =
                    "Weak password.";

            }

            else if (score === 3) {

                strengthBar.style.background =
                    "#eab308";

                strengthText.textContent =
                    "Moderate password.";

            }

            else if (score === 4) {

                strengthBar.style.background =
                    "#84cc16";

                strengthText.textContent =
                    "Strong password.";

            }

            else {

                strengthBar.style.background =
                    "#a8cfbc";

                strengthText.textContent =
                    "Very strong password.";

            }

        }


        passwordInput.addEventListener(
            "input",
            () => {

                updatePasswordStrength(
                    passwordInput.value
                );

            }
        );


        /*
         * Show / hide password
         */

        document
            .getElementById("toggle-password")
            .addEventListener(
                "click",
                () => {

                    const isPassword =
                        passwordInput.type ===
                        "password";

                    passwordInput.type =
                        isPassword
                            ? "text"
                            : "password";

                    document
                        .getElementById(
                            "password-icon"
                        )
                        .textContent =
                            isPassword
                                ? "visibility_off"
                                : "visibility";

                }
            );


        /*
         * Register
         */

        registerForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                errorMessage.classList.add(
                    "hidden"
                );

                successMessage.classList.add(
                    "hidden"
                );


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                if (!email) {

                    showError(
                        "Please enter your email address."
                    );

                    return;

                }


                if (password.length < 8) {

                    showError(
                        "Password must contain at least 8 characters."
                    );

                    return;

                }


                if (password !== confirmPassword) {

                    showError(
                        "Passwords do not match."
                    );

                    return;

                }


                setLoading(true);


                try {

                    /*
                     * Your FastAPI backend currently expects:
                     *
                     * POST /auth/register
                     *
                     * email
                     * password
                     *
                     * as query/form parameters.
                     *
                     * We send them as URL-encoded form data.
                     */

                    const body =
                        new URLSearchParams();

                    body.append(
                        "email",
                        email
                    );

                    body.append(
                        "password",
                        password
                    );


                    const response =
                        await fetch(
                            `${API_BASE}/auth/register`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded"
                                },

                                body
                            }
                        );


                    let data = {};

                    try {

                        data =
                            await response.json();

                    } catch {

                        data = {};

                    }


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Registration failed."
                        );

                    }


                    showSuccess(
                        "Account created successfully. Redirecting to sign in..."
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "login.html";

                        },
                        800
                    );


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    showError(
                        error.message ||
                        "Unable to create your account."
                    );


                } finally {

                    setLoading(false);

                }

            }
        );


        /*
         * Background stars
         */

        const starfield =
            document.getElementById(
                "starfield"
            );


        for (let i = 0; i < 80; i++) {

            const star =
                document.createElement(
                    "div"
                );

            star.className =
                "star";

            star.style.left =
                `${Math.random() * 100}%`;

            star.style.top =
                `${Math.random() * 100}%`;

            star.style.animationDelay =
                `${Math.random() * 8}s`;

            starfield.appendChild(
                star
            );

        }

    </script>

</body>
</html>
