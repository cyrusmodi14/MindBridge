<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;

        /* Starfield animation */
        .stars {
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF; /* Simplified for example, real would have hundreds */
            animation: animStar 50s linear infinite;
        }

        .stars2 {
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;
            animation: animStar 100s linear infinite;
        }

        .stars3 {
            width: 3px;
            height: 3px;
            background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;

        }

            from { transform: translateY(0px) }
            to { transform: translateY(-2000px) }

<body class="bg-[#020617] text-on-surface min-h-screen relative overflow-hidden flex items-center justify-center font-body-md text-body-md">

<div class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">

</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-6 text-center">Welcome Back to Your Space</h2>
<form class="w-full space-y-6">
<!-- Email Input -->
<div class="space-y-2">

<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</span>
<input class="w-full bg-[#0F172A] border border-surface-variant text-on-surface rounded-lg pl-10 py-3 focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all duration-300 outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</span>
<input class="w-full bg-[#0F172A] border border-surface-variant text-on-surface rounded-lg pl-10 py-3 focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all duration-300 outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#D1FAE5] text-[#0F172A] font-headline-md text-body-md font-bold py-3 rounded-lg hover:bg-secondary-fixed transition-colors duration-300 flex items-center justify-center space-x-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-secondary hover:text-secondary-fixed font-semibold transition-colors" href="#">Create one</a>
</p>
</div>
</div>
</div>
<script>
        // Simple starfield generation for fallback visual effect if animation token isn't used
        function createStars() {
            const container = document.getElementById('stars-container');
            const numStars = 100;
            
            for(let i=0; i<3; i++) {
                let layer = document.createElement('div');
                layer.className = `stars${i===0 ? '' : i+1} absolute top-0 left-0`;
                
                let shadows = [];
                for(let j=0; j<numStars; j++) {
                    shadows.push(`${Math.floor(Math.random() * window.innerWidth)}px ${Math.floor(Math.random() * window.innerHeight * 2)}px #FFF`);
                }
                layer.style.boxShadow = shadows.join(', ');
                container.appendChild(layer);
            }
        }
        createStars();
        window.addEventListener('resize', () => {
            const container = document.getElementById('stars-container');
            container.innerHTML = '';
            createStars();
        });
    </script>
