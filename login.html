<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solace — Sign In</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet"
    >

    <style>
        body {
            background:
                radial-gradient(circle at 50% 10%, rgba(41,78,63,.35), transparent 35%),
                #051424;
        }

        .glass {
            background: rgba(18,33,49,.58);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,.08);
        }

        input {
            background: rgba(5,20,36,.65) !important;
            border: 1px solid rgba(255,255,255,.1) !important;
            color: white !important;
        }

        input:focus {
            border-color: rgba(168,207,188,.7) !important;
            box-shadow: 0 0 0 3px rgba(168,207,188,.08) !important;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-5 text-white">

<div class="w-full max-w-md">

    <a href="landing.html"
       class="block text-center text-2xl font-bold text-[#A8CFBC] mb-8"
       style="font-family:Manrope,sans-serif">
        Solace
    </a>

    <div class="glass rounded-3xl p-7 md:p-9">

        <div class="text-center">

            <div class="mx-auto w-14 h-14 rounded-2xl bg-[#294E3F] flex items-center justify-center">
                <span class="material-symbols-outlined text-[#A8CFBC] text-3xl">
                    self_improvement
                </span>
            </div>

            <h1 class="mt-5 text-3xl font-bold">
                Welcome Back
            </h1>

            <p class="mt-2 text-white/50">
                Sign in to your Solace space.
            </p>

        </div>

        <div id="message"
             class="hidden mt-6 rounded-xl px-4 py-3 text-sm">
        </div>

        <form id="loginForm" class="mt-7 space-y-5">

            <div>
                <label class="block text-sm text-white/70 mb-2">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    required
                    autocomplete="email"
                    placeholder="you@example.com"
                    class="w-full rounded-xl px-4 py-3.5 outline-none"
                >
            </div>

            <div>
                <label class="block text-sm text-white/70 mb-2">
                    Password
                </label>

                <div class="relative">

                    <input
                        id="password"
                        type="password"
                        required
                        autocomplete="current-password"
                        placeholder="Your password"
                        class="w-full rounded-xl px-4 py-3.5 pr-12 outline-none"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40"
                    >
                        <span class="material-symbols-outlined">
                            visibility
                        </span>
                    </button>

                </div>

                <button
                    id="forgotBtn"
                    type="button"
                    class="mt-2 text-xs text-[#A8CFBC] hover:underline"
                >
                    Forgot password?
                </button>
            </div>

            <button
                id="loginBtn"
                type="submit"
                class="w-full rounded-xl bg-[#A8CFBC] text-slate-950 py-3.5 font-semibold"
            >
                Sign In
            </button>

        </form>

        <div class="mt-7 pt-6 border-t border-white/10 text-center text-sm text-white/45">

            Don't have an account?

            <a href="register.html"
               class="text-[#A8CFBC] font-semibold">
                Create one
            </a>

        </div>

    </div>

</div>

<script>
    const API_BASE = "http://127.0.0.1:8000";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");

    function showMessage(text, success = false) {
        message.textContent = text;
        message.className =
            "mt-6 rounded-xl px-4 py-3 text-sm " +
            (success
                ? "bg-green-500/10 text-green-300 border border-green-500/20"
                : "bg-red-500/10 text-red-200 border border-red-500/20");
        message.classList.remove("hidden");
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        button.disabled = true;
        button.textContent = "Signing in...";

        const body = new URLSearchParams();

        body.append(
            "username",
            document.getElementById("email").value.trim()
        );

        body.append(
            "password",
            document.getElementById("password").value
        );

        try {

            const response = await fetch(
                `${API_BASE}/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Invalid email or password."
                );
            }

            localStorage.setItem(
                "access_token",
                data.access_token
            );

            localStorage.setItem(
                "user_id",
                data.user_id
            );

            localStorage.setItem(
                "token_type",
                data.token_type || "bearer"
            );

            showMessage(
                "Welcome back to Solace.",
                true
            );

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 500);

        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to sign in."
            );

        } finally {

            button.disabled = false;
            button.textContent = "Sign In";
        }
    });

    document.getElementById("togglePassword")
        .addEventListener("click", () => {

            const password =
                document.getElementById("password");

            password.type =
                password.type === "password"
                    ? "text"
                    : "password";
        });

    document.getElementById("forgotBtn")
        .addEventListener("click", async () => {

            const email =
                document.getElementById("email").value.trim();

            if (!email) {
                showMessage("Enter your email first.");
                return;
            }

            const newPassword =
                prompt("Enter your new password:");

            if (!newPassword) return;

            const url =
                `${API_BASE}/auth/reset-password` +
                `?email=${encodeURIComponent(email)}` +
                `&new_password=${encodeURIComponent(newPassword)}`;

            try {

                const response =
                    await fetch(url, {
                        method: "POST"
                    });

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Reset failed."
                    );
                }

                showMessage(
                    "Password reset successfully.",
                    true
                );

            } catch (error) {

                showMessage(error.message);
            }
        });
</script>

</body>
</html>
