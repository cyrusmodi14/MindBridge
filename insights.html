<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solace — Insights</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            background:
                radial-gradient(circle at 20% 0%, rgba(41,78,63,.25), transparent 35%),
                #051424;
        }

        .glass {
            background: rgba(18,33,49,.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.08);
        }

        .mood {
            transition: .2s ease;
        }

        .mood.selected {
            background: rgba(41,78,63,.8);
            border-color: rgba(168,207,188,.6);
        }

        input[type="range"] {
            accent-color: #A8CFBC;
        }
    </style>
</head>

<body class="min-h-screen text-white">

<script>
    const API_BASE = "http://127.0.0.1:8000";

    if (!localStorage.getItem("access_token")) {
        window.location.href = "login.html";
    }
</script>

<header class="fixed top-0 left-0 right-0 z-40 glass border-b border-white/5">

    <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">

        <a href="dashboard.html"
           class="text-xl font-bold text-[#A8CFBC]">
            Solace
        </a>

        <nav class="flex items-center gap-4 text-sm">

            <a href="dashboard.html"
               class="text-white/45">
                Dashboard
            </a>

            <a href="insights.html"
               class="text-[#A8CFBC]">
                Insights
            </a>

            <a href="chat.html"
               class="text-white/45">
                Chat
            </a>

        </nav>

    </div>
</header>

<main class="max-w-6xl mx-auto px-5 pt-28 pb-16">

    <section>

        <p class="text-xs uppercase tracking-[.2em] text-[#A8CFBC]">
            Daily check-in
        </p>

        <h1 class="mt-3 text-3xl md:text-5xl font-bold">
            How are you feeling today?
        </h1>

        <p class="mt-4 text-white/50 max-w-2xl leading-7">
            Choose the mood that feels closest right now, then
            describe your current energy level.
        </p>

    </section>

    <section class="glass rounded-3xl p-6 md:p-8 mt-10">

        <h2 class="text-xl font-bold">
            Your mood
        </h2>

        <div id="moodGrid"
             class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-6">

            <button class="mood glass rounded-2xl p-5 text-left"
                    data-mood="joyful">
                <span class="text-2xl">😊</span>
                <p class="mt-3 font-semibold">Joyful</p>
            </button>

            <button class="mood glass rounded-2xl p-5 text-left"
                    data-mood="content">
                <span class="text-2xl">🙂</span>
                <p class="mt-3 font-semibold">Content</p>
            </button>

            <button class="mood glass rounded-2xl p-5 text-left"
                    data-mood="neutral">
                <span class="text-2xl">😐</span>
                <p class="mt-3 font-semibold">Neutral</p>
            </button>

            <button class="mood glass rounded-2xl p-5 text-left"
                    data-mood="anxious">
                <span class="text-2xl">😟</span>
                <p class="mt-3 font-semibold">Anxious</p>
            </button>

            <button class="mood glass rounded-2xl p-5 text-left"
                    data-mood="sad">
                <span class="text-2xl">😔</span>
                <p class="mt-3 font-semibold">Sad</p>
            </button>

        </div>

    </section>

    <section class="glass rounded-3xl p-6 md:p-8 mt-6">

        <div class="flex justify-between">

            <div>
                <h2 class="text-xl font-bold">
                    Energy
                </h2>

                <p class="mt-1 text-sm text-white/40">
                    How much energy do you have right now?
                </p>
            </div>

            <div id="energyValue"
                 class="text-2xl font-bold text-[#A8CFBC]">
                5
            </div>

        </div>

        <input
            id="energy"
            type="range"
            min="1"
            max="10"
            value="5"
            class="w-full mt-8"
        >

        <div class="flex justify-between text-xs text-white/30">
            <span>Very low</span>
            <span>Balanced</span>
            <span>Very high</span>
        </div>

    </section>

    <button
        id="save"
        class="w-full mt-6 rounded-2xl bg-[#A8CFBC] text-slate-950 py-4 font-semibold"
    >
        Save Check-In
    </button>

    <p id="status"
       class="mt-4 text-center text-sm text-white/40">
    </p>

    <section class="glass rounded-3xl p-6 mt-10">

        <h2 class="text-xl font-bold">
            Recent history
        </h2>

        <div id="history"
             class="mt-6 space-y-3">
        </div>

    </section>

</main>

<script>
    let selectedMood = null;

    const authHeaders = () => ({
        Authorization:
            `Bearer ${localStorage.getItem("access_token")}`
    });

    document.querySelectorAll(".mood")
        .forEach(button => {

            button.addEventListener("click", () => {

                document.querySelectorAll(".mood")
                    .forEach(item => {
                        item.classList.remove("selected");
                    });

                button.classList.add("selected");

                selectedMood =
                    button.dataset.mood;
            });
        });

    document.getElementById("energy")
        .addEventListener("input", event => {

            document.getElementById("energyValue")
                .textContent =
                event.target.value;
        });

    document.getElementById("save")
        .addEventListener("click", async () => {

            const status =
                document.getElementById("status");

            if (!selectedMood) {
                status.textContent =
                    "Please choose a mood first.";
                return;
            }

            const energy =
                Number(
                    document.getElementById("energy").value
                );

            try {

                const response =
                    await fetch(
                        `${API_BASE}/mood/`,
                        {
                            method: "POST",
                            headers: {
                                ...authHeaders(),
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                mood: selectedMood,
                                energy
                            })
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail ||
                        "Unable to save check-in."
                    );
                }

                status.className =
                    "mt-4 text-center text-sm text-[#A8CFBC]";

                status.textContent =
                    "Your check-in has been saved.";

                loadHistory();

            } catch (error) {

                console.error(error);

                status.className =
                    "mt-4 text-center text-sm text-yellow-300";

                status.textContent =
                    error.message ||
                    "Unable to save check-in.";
            }
        });

    async function loadHistory() {

        const container =
            document.getElementById("history");

        try {

            const response =
                await fetch(
                    `${API_BASE}/mood/history`,
                    {
                        headers: authHeaders()
                    }
                );

            if (!response.ok) {
                throw new Error();
            }

            const data =
                await response.json();

            const history =
                data.history || [];

            if (!history.length) {

                container.innerHTML = `
                    <p class="text-sm text-white/30">
                        No mood history yet.
                    </p>
                `;

                return;
            }

            container.innerHTML =
                history
                    .slice(0, 10)
                    .map(item => `
                        <div class="rounded-2xl bg-white/[0.03] border border-white/5 p-4 flex items-center justify-between">

                            <div>
                                <p class="font-semibold capitalize">
                                    ${item.mood}
                                </p>

                                <p class="text-xs text-white/30 mt-1">
                                    ${item.date || ""}
                                </p>
                            </div>

                            <span class="text-[#A8CFBC] font-bold">
                                ${item.energy}/10
                            </span>

                        </div>
                    `)
                    .join("");

        } catch {

            container.innerHTML = `
                <p class="text-sm text-yellow-300">
                    Mood history is not connected to persistent storage yet.
                </p>
            `;
        }
    }

    loadHistory();
</script>

</body>
</html>
